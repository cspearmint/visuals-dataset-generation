# Baseline B — amodal 3D box regression (centre + dimensions + yaw) from a
# given 2D box. Shares MonoDETR's per-image index, so B and A are scored against
# identical labels on an identical split.
#
#   sbatch --account=$GROUP --qos=$GROUP hipergator/train_box3d.sbatch
#
# The SAME config is used for training and for the final evaluation, so the
# train/val split cannot diverge between them.
model: box3d

index_file: data/output/det_records.jsonl

batch_size: 32
num_workers: 7
val_split: 0.2
seed: 42

# Segment-level split. Held-out segments are entirely different drives, so no
# image, and no temporal neighbour of one, appears on both sides.
group_by: segment

# ALL 10 weather variants on BOTH sides. A training segment contributes every
# one of its renderings; the held-out segments are scored across every rendering
# too. This mirrors the data the visuals agent will be trained on. Leave unset.
# (Setting it to e.g. [clear] is a LATER experiment, not the default.)
train_weathers: null

# The compute knob. Frames are ~10 Hz so neighbours are near-duplicates; thinning
# them costs little information, unlike dropping weather variants. 1 = keep all.
#   stride 1 -> ~930k objects/epoch  (~26 h for 30 epochs)
#   stride 4 -> ~233k objects/epoch  (~6.5 h for 30 epochs)
frame_stride: 4

min_box_px: 0
min_pts: 0
drop_truncated: true

huber_beta: 0.1
w_center: 1.0
w_depth: 2.0
w_dim: 1.0
w_angle: 1.0

lr: 1.0e-4
epochs: 30
checkpoint_dir: baselines/checkpoints/box3d
