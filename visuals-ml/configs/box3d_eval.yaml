# Baseline B — FINAL EVALUATION across all 10 weather variants.
#
# Identical to configs/box3d.yaml except `train_weathers` is unset, so evaluation
# spans every weather instead of clear only. Weather is the TEST axis: the model
# trains on clear and is scored on all 10.
#
# Every key that feeds the train/val split (index_file, val_split, seed,
# group_by, drop_truncated, min_*) MUST match configs/box3d.yaml exactly, or the
# split diverges and the "held-out" set fills with segments the model trained on.
# Verify by comparing the `Group split fingerprint:` line in the training log and
# this eval's log -- the val= hash must be identical.
model: box3d

index_file: data/output/det_records.jsonl

batch_size: 32
num_workers: 6
val_split: 0.2
seed: 42
group_by: segment

# UNSET on purpose -> evaluate on all 10 weather variants.
train_weathers: null

min_box_px: 0
min_pts: 0
drop_truncated: true

huber_beta: 0.1
w_center: 1.0
w_depth: 2.0
w_dim: 1.0
w_angle: 1.0

lr: 1.0e-4
epochs: 30
checkpoint_dir: baselines/checkpoints/box3d
